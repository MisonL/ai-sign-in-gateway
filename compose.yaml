services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-sign-in-gateway
    ports:
      - "8972:8972"
    environment:
      APP_NAME: 爱签网关
      AI_SIGN_IN_GATEWAY_CONFIG_DIR: /app/data
      DATABASE_URL: sqlite:////app/data/ai-sign-in-gateway.db
      SECRET_KEY: change-this-secret-key-before-production-123456789
      GATEWAY_API_KEY: change-this-gateway-key-before-production-123456789
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: change-this-admin-password-before-production
      SCHEDULER_TIMEZONE: Asia/Shanghai
      CORS_ORIGINS: http://localhost:8972,http://127.0.0.1:8972
    volumes:
      - ai-sign-in-gateway-data:/app/data
    restart: unless-stopped

volumes:
  ai-sign-in-gateway-data:
