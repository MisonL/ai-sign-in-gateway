name: Publish Release From Artifacts

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="$(sed -n 's/^version=//p' RELEASE.txt | head -n 1)"
          if [[ -z "$version" ]]; then
            echo "RELEASE.txt missing version=<tag>" >&2
            exit 1
          fi

          notes_file="RELEASE_NOTES.md"
          if [[ ! -f "$notes_file" ]]; then
            echo "RELEASE_NOTES.md not found" >&2
            exit 1
          fi

          artifacts=()
          while IFS= read -r -d '' file; do
            artifacts+=("$file")
          done < <(
            find . -maxdepth 1 -type f \
              ! -name README.md \
              ! -name RELEASE.txt \
              ! -name RELEASE_NOTES.md \
              -print0
          )

          if [[ "${#artifacts[@]}" -eq 0 ]]; then
            echo "No release artifacts found" >&2
            exit 1
          fi

          if gh release view "$version" >/dev/null 2>&1; then
            gh release edit "$version" --title "$version" --notes-file "$notes_file"
            gh release upload "$version" "${artifacts[@]}" --clobber
          else
            gh release create "$version" "${artifacts[@]}" \
              --title "$version" \
              --notes-file "$notes_file" \
              --verify-tag
          fi
